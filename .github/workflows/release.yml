name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Maven release version, for example 0.1.0
        required: true
        type: string
      next_snapshot_version:
        description: Next development version, for example 0.1.1-SNAPSHOT
        required: true
        type: string
      publish:
        description: Publish to Maven Central and push release commits/tag
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.release_version }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ inputs.release_version }}"
          next_snapshot_version="${{ inputs.next_snapshot_version }}"
          publish="${{ inputs.publish }}"

          if [[ "$release_version" == *-SNAPSHOT ]]; then
            echo "release_version must not end with -SNAPSHOT" >&2
            exit 1
          fi

          if [[ "$next_snapshot_version" != *-SNAPSHOT ]]; then
            echo "next_snapshot_version must end with -SNAPSHOT" >&2
            exit 1
          fi

          if [[ "$publish" == "true" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Publishing releases is only allowed from main; current ref is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          if [[ "$publish" == "true" ]] && git rev-parse "v${release_version}" >/dev/null 2>&1; then
            echo "Tag v${release_version} already exists" >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version
        run: >
          mvn -B -ntp versions:set
          -DnewVersion="${{ inputs.release_version }}"
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Build release bundle without publishing
        if: ${{ !inputs.publish }}
        run: >
          mvn -B -ntp -Pcentral-release
          -Dcentral.skipPublishing=true
          deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Commit release version and tag
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ inputs.release_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pom.xml parent/pom.xml core/pom.xml processor/pom.xml benchmark/pom.xml
          if git diff --cached --quiet; then
            echo "No POM changes for release version ${release_version}; tagging current commit."
          else
            git commit -m "Release ${release_version}"
          fi

          git tag -a "v${release_version}" -m "Release ${release_version}"

      - name: Publish to Maven Central
        if: ${{ inputs.publish }}
        run: mvn -B -ntp -Pcentral-release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Commit next snapshot and push
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail

          release_version="${{ inputs.release_version }}"
          next_snapshot_version="${{ inputs.next_snapshot_version }}"

          mvn -B -ntp versions:set \
            -DnewVersion="${next_snapshot_version}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

          git add pom.xml parent/pom.xml core/pom.xml processor/pom.xml benchmark/pom.xml
          git commit -m "Prepare next development iteration"
          git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v${release_version}"
