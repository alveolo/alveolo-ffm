name: Release
run-name: Release ${{ inputs.release_version }} (${{ inputs.operation }})

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - prepare
          - publish
      release_version:
        description: Maven release version, for example 0.1.0
        required: true
        type: string
      next_snapshot_version:
        description: Required for prepare only, for example 0.1.1-SNAPSHOT
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_OPERATION: ${{ inputs.operation }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      NEXT_SNAPSHOT_VERSION: ${{ inputs.next_snapshot_version }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          case "$RELEASE_OPERATION" in
            dry-run|prepare|publish) ;;
            *) echo "Unknown release operation" >&2; exit 1 ;;
          esac

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9][A-Za-z0-9._-]*$ || "$RELEASE_VERSION" == *-SNAPSHOT ]]; then
            echo "release_version must be a release version, for example 0.1.0" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/v${RELEASE_VERSION}"

          if [[ "$RELEASE_OPERATION" != "dry-run" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Prepare and publish must be run from main" >&2
            exit 1
          fi

          if [[ "$RELEASE_OPERATION" == "prepare" ]]; then
            if [[ ! "$NEXT_SNAPSHOT_VERSION" =~ ^[0-9][A-Za-z0-9._-]*-SNAPSHOT$ ]]; then
              echo "next_snapshot_version must be a snapshot version, for example 0.1.1-SNAPSHOT" >&2
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
              echo "Tag v${RELEASE_VERSION} already exists; use publish to release that tag" >&2
              exit 1
            fi
          fi

      - name: Check out prepared release
        if: ${{ inputs.operation == 'publish' }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/v${RELEASE_VERSION}^{commit}"
          git checkout --detach "refs/tags/v${RELEASE_VERSION}"

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = os.environ["RELEASE_VERSION"]
          for path in ["pom.xml", "parent/pom.xml", "core/pom.xml", "processor/pom.xml", "benchmark/pom.xml"]:
              project = ET.parse(path).getroot()
              versions = project.findall("m:version", namespace) + project.findall("m:parent/m:version", namespace)
              if not versions or any(element.text != version for element in versions):
                  raise SystemExit(f"{path}: expected release version {version}")
          PY

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version
        if: ${{ inputs.operation != 'publish' }}
        run: >
          mvn -B -ntp versions:set
          -DnewVersion="$RELEASE_VERSION"
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Build release bundle without publishing
        if: ${{ inputs.operation != 'publish' }}
        run: >
          mvn -B -ntp -Pcentral-release
          -Dcentral.skipPublishing=true
          deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Prepare release and next development version
        if: ${{ inputs.operation == 'prepare' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pom.xml parent/pom.xml core/pom.xml processor/pom.xml benchmark/pom.xml
          if ! git diff --cached --quiet; then
            git commit -m "Release ${RELEASE_VERSION}"
          fi
          git tag -a "v${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"

          mvn -B -ntp versions:set \
            -DnewVersion="$NEXT_SNAPSHOT_VERSION" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false
          git add pom.xml parent/pom.xml core/pom.xml processor/pom.xml benchmark/pom.xml
          git commit -m "Prepare next development iteration"

          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v${RELEASE_VERSION}"

      - name: Publish prepared release to Maven Central
        if: ${{ inputs.operation == 'publish' }}
        run: mvn -B -ntp -Pcentral-release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
